# drone_control/config/system_params.yaml
# System-wide configuration

ros:
  master:
    uri: "http://localhost:11311"
    timeout: 5.0
  node:
    name: "drone_control"
    namespace: "/"
  topics:
    camera_image: "/camera/color/image_raw"
    camera_info: "/camera/color/camera_info"
    vehicle_state: "/mavros/state"
    vehicle_position: "/mavros/local_position/pose"
    vehicle_velocity: "/mavros/local_position/velocity"
    vehicle_attitude: "/mavros/attitude"
    battery_status: "/mavros/battery"
    detection_output: "/target_detections"
    tracked_targets: "/tracked_targets"
    control_command: "/mavros/setpoint_raw/local"
    safety_status: "/safety_status"
    diagnostic_status: "/diagnostics"
    debug_info: "/drone_control/debug"
    performance_metrics: "/drone_control/performance"
    test_results: "/drone_control/test/results"
    test_status: "/drone_control/test/status"

logging:
  level: "info"
  outputs:
    console: true
    file: true
    rosout: true
  file:
    directory: "/var/log/drone_control"
    max_size: 100
    max_files: 5
    format: "%Y-%m-%d_%H-%M-%S.log"
  performance:
    enabled: true
    interval: 1.0
    metrics: ["cpu", "memory", "latency", "fps"]
    output_file: "performance_metrics.csv"

safety:
  geofence:
    enabled: true
    shape: "cylinder"
    radius: 100.0
    height: 50.0
  emergency:
    action: "land"
    altitude_min: 2.0
    altitude_max: 50.0
  failsafe:
    battery_critical: 15.0
    lost_connection: 5.0
    gps_failure: true
    sensor_failure: true
    exceeded_geofence: true
  health:
    check_interval: 1.0
    restart_on_failure: true
    max_restarts: 3
    restart_delay: 5.0

performance:
  threads:
    detection_pool: 4
    control_pool: 2
  queues:
    input_queue_size: 10
    output_queue_size: 10
  memory:
    cache_images: true
    max_cache_size: 100
    max_cached_messages: 1000
  timing:
    use_sim_time: false
    publish_rate: 50
    control_rate: 50

network:
  px4:
    udp_port: 14540
    tcp_port: 14550
    heartbeat_rate: 1.0
  mavros:
    fcu_url: "udp://:14540@127.0.0.1:14557"
    gcs_url: "udp://@127.0.0.1:14550"
  timeout: 10.0
  reconnect_attempts: 3
  reconnect_delay: 5.0