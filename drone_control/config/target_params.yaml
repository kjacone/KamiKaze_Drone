# drone_control/config/target_params.yaml
# Target detection and tracking parameters

detection:
  model:
    path: "/PX4-Autopilot/yolov8s.pt"
    device: "cpu"
    input_size: 416
    batch_size: 1
  confidence_threshold: 0.5
  nms_threshold: 0.4
  max_detections: 100
  vehicle_classes: [1, 2, 3, 5, 6, 7, 8]
  class_thresholds:
    class_1: 0.4  # bicycle
    class_2: 0.6  # car
    class_3: 0.5  # motorcycle
    class_5: 0.7  # bus
    class_6: 0.6  # train
    class_7: 0.6  # truck
    class_8: 0.5  # boat
  performance:
    max_fps: 30
    frame_skip: 0
    parallel_inference: false
    gpu_memory_limit: 2048

tracking:
  engagement_distance: 10.0
  attack_distance: 2.0
  disengagement_distance: 15.0
  max_tracks: 20
  max_lost_frames: 10
  min_track_length: 3
  track_confidence_threshold: 0.3
  association:
    iou_threshold: 0.3
    distance_threshold: 1.0
    appearance_weight: 0.3
    motion_weight: 0.7
  kalman:
    dt: 0.1
    process_noise: 0.1
    measurement_noise: 0.05
    initial_velocity: 0.0
    state_dim: 6
    measurement_dim: 3

behavior:
  speed_classes:
    stationary: 0.0
    slow: 2.0
    medium: 5.0
    fast: 10.0
    extreme: 20.0
  models:
    random_walk:
      noise_scale: 0.1
      persistence: 0.8
    pursuit:
      max_acceleration: 2.0
      max_turn_rate: 1.0
    evasion:
      max_acceleration: 3.0
      max_turn_rate: 2.0
  threat:
    distance_weights: [0.4, 0.3, 0.2, 0.1]
    speed_thresholds:
      low: 2.0
      medium: 5.0
      high: 10.0
    priority_boost: 1.2

performance:
  update_rates:
    detection: 30
    tracking: 30
    control: 50
    state: 10
  latency:
    max_detection: 0.1
    max_tracking: 0.05
    max_control: 0.02
  resources:
    max_memory_mb: 2048
    max_cpu_percent: 80
    max_gpu_memory_mb: 1024

camera:
  fx: 500.0
  fy: 500.0
  cx: 320.0
  cy: 240.0
  width: 640
  height: 480
  fov: 60.0