# drone_control/config/kalman_filter.yaml
# Kalman filter configuration

kalman_filter:
  type: "extended"
  state_dim: 9
  measurement_dim: 3
  
  noise:
    process:
      position: 0.1
      velocity: 0.05
      acceleration: 0.02
    measurement:
      position: 0.05
  
  parameters:
    dt: 0.1
    adaptive:
      enabled: true
      update_rate: 10
      innovation_threshold: 0.5
    outlier_rejection:
      enabled: true
      mahalanobis_threshold: 3.0
      gating: true
    initialization:
      max_measurements: 5
      min_velocity_samples: 3
    convergence:
      max_iterations: 10
      epsilon: 0.001

  multi_target:
    enabled: true
    max_targets: 20
    association:
      method: "gmphd"
      gating:
        enabled: true
        gate_size: 3.0
        dynamic_gating: true
      track_management:
        birth_probability: 0.1
        death_threshold: 0.5
        merge_threshold: 0.3
    scoring:
      position_weight: 0.4
      velocity_weight: 0.3
      appearance_weight: 0.3
      history_length: 10

sensor_fusion:
  sensors:
    - type: "camera"
      weight: 0.6
      update_rate: 30
    - type: "radar"
      weight: 0.3
      update_rate: 10
    - type: "lidar"
      weight: 0.1
      update_rate: 5
  algorithms:
    type: "centralized"
    centralized:
      measurement_dim: 9
    track_to_track:
      covariance_intersection: true
      gamma: 0.5