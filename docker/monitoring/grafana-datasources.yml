apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    version: 1
    editable: true

  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://localhost:8086
    database: drone_metrics
    user: admin
    password: admin
    isDefault: false
    version: 1
    editable: true