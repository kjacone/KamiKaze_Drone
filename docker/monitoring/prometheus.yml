global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    monitor: "drone-control"

rule_files:
  - "/etc/prometheus/rules.yml"

scrape_configs:

  # ============================================================
  # Prometheus Self-Monitoring
  # ============================================================

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"  # Changed from localhost to container name

  # ============================================================
  # ROS Metrics - From Kamikaze Drone
  # ============================================================

  - job_name: "ros-metrics"
    static_configs:
      - targets:
          - "kamikaze:8001"  # ROS metrics exporter port
          - "kamikaze:11311"  # ROS master (if it exposes metrics)
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s
    params:
      collect[]:
        - "ros"
        - "gazebo"
        - "drone"

  # ============================================================
  # Kamikaze Drone Application Metrics
  # ============================================================

  - job_name: "kamikaze-drone"
    static_configs:
      - targets:
          - "kamikaze:8001"  # Main drone metrics
    metrics_path: "/metrics"
    scrape_interval: 5s
    scrape_timeout: 3s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "kamikaze_drone"

  # ============================================================
  # Predictive Controller Metrics
  # ============================================================

  - job_name: "predictive-controller"
    static_configs:
      - targets:
          - "predictive:8002"  # Predictive controller metrics port
    metrics_path: "/metrics"
    scrape_interval: 5s
    scrape_timeout: 3s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "predictive_controller"

  # ============================================================
  # Trajectory Planner Metrics
  # ============================================================

  - job_name: "trajectory-planner"
    static_configs:
      - targets:
          - "trajectory:8003"  # Trajectory planner metrics port
    metrics_path: "/metrics"
    scrape_interval: 5s
    scrape_timeout: 3s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "trajectory_planner"

  # ============================================================
  # Performance Monitor
  # ============================================================

  - job_name: "performance-monitor"
    static_configs:
      - targets:
          - "performance:8000"  # Performance monitor port
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s



  # ============================================================
  # ROS Topics Metrics (if exposed via HTTP)
  # ============================================================

  - job_name: "ros-topics"
    static_configs:
      - targets:
          - "kamikaze:8001"  # Same as ROS metrics
    metrics_path: "/metrics/topics"
    scrape_interval: 5s
    scrape_timeout: 3s
    params:
      topic[]:
        - "/drone/state"
        - "/drone/odometry"
        - "/drone/imu"
        - "/drone/gps"
        - "/drone/cmd_vel"

  # ============================================================
  # ROS Service Metrics
  # ============================================================

  - job_name: "ros-services"
    static_configs:
      - targets:
          - "kamikaze:8001"
    metrics_path: "/metrics/services"
    scrape_interval: 10s
    scrape_timeout: 5s

