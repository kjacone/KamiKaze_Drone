global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'drone-control'

rule_files:
  - "prometheus_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['localhost:8081']

  - job_name: 'ros-metrics'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'

  - job_name: 'performance-monitor'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics/performance'