[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name             tail
    Path             /var/lib/docker/containers/*/*.log
    Parser           docker
    Tag              docker.*
    Refresh_Interval 5
    Mem_Buf_Limit    50MB
    Skip_Long_Lines  On
    DB               /fluent-bit/etc/pos.db
    DB.Sync          Normal

[FILTER]
    Name                parser
    Match               docker.*
    Key_Name            log
    Parser              app_json
    Reserve_Data        On
    Preserve_Key        On

[FILTER]
    Name                modify
    Match               docker.*
    # Remove fields we don't need
    Remove              stream
    Remove              attrs

[FILTER]
    Name                record_modifier
    Match               docker.*
    # Add custom fields
    Record              source docker
    Record              environment production

[FILTER]
    Name                grep
    Match               docker.*
    # Keep only logs that have a log field (skip empty)
    Regex               log .+

# IMPORTANT: Labels must be comma-separated key=value pairs, NOT JSON
[OUTPUT]
    Name             loki
    Match            docker.*
    Host             loki
    Port             3100
    Labels           source=docker,environment=production
    Line_Format      json
    Retry_Limit      5

[OUTPUT]
    Name             stdout
    Match            docker.*
    Format           json_lines