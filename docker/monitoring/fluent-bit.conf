[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.*
    Path_Key          filepath
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Buffer_Chunk_Size 1MB
    Buffer_Max_Size   5MB
    Skip_Long_Lines   Off
    DB                /fluent-bit/etc/pos.db
    DB.Sync           Normal

[FILTER]
    Name                parser
    Match               docker.*
    Key_Name            log
    Parser              app_json
    Reserve_Data        On
    Preserve_Key        On

[FILTER]
    Name                parser
    Match               docker.*
    Key_Name            filepath
    Parser               container_id_from_path
    Reserve_Data         On
    Preserve_Key         On

# Resolves container_id -> human-readable container_name
# by reading Docker's own config.v2.json for that container.
[FILTER]
    Name                lua
    Match               docker.*
    script              container_name.lua
    call                add_container_name

[FILTER]
    Name                modify
    Match               docker.*
    # Skip re-ingesting fluent_bit's own log lines to avoid
    # a self-referential feedback loop (fluent_bit tailing its
    # own stdout, which contains its own prior log lines).
    Condition           Key_Value_Equals container_name fluent_bit
    Remove              log

[FILTER]
    Name                grep
    Match               docker.*
    # Exclude fluent_bit's own logs entirely (belt-and-suspenders
    # alongside the stdout output removal below)
    Exclude              container_name fluent_bit

[FILTER]
    Name                modify
    Match               docker.*
    # Remove fields we don't need
    Remove              stream
    Remove              attrs
    Remove              filepath
    Remove              container_id

[FILTER]
    Name                record_modifier
    Match               docker.*
    # Add custom fields
    Record              source docker
    Record              environment production

[FILTER]
    Name                grep
    Match               docker.*
    # Keep only logs that have a log field (skip empty)
    Regex               log .+

# IMPORTANT: Labels must be comma-separated key=value pairs, NOT JSON
[OUTPUT]
    Name             loki
    Match            docker.*
    Host             loki
    Port             3100
    Labels           source=docker,environment=production
    Label_Keys       $container_name
    Line_Format      json
    Retry_Limit      5

# stdout output intentionally removed: it was the source of a
# recursive self-ingestion loop, since fluent_bit tails its own
# container's log file and would re-ingest everything it printed
# to stdout, wrapping it in a new JSON layer every cycle.