
services:
  # Main drone service
  kamikaze:
    build:
      context: ..
      dockerfile: Dockerfile
      network: host
    platform: linux/amd64
    container_name: kamikaze_drone
    hostname: kamikaze
    environment:
      - ROS_HOSTNAME=localhost
      - ROS_IP=127.0.0.1
      - ROS_MASTER_URI=http://localhost:11311
      - ENABLE_GUI=false
      - ENABLE_PERFORMANCE_MONITORING=true
      - PYTHONUNBUFFERED=1
    volumes:
      - ../logs:/root/.ros/log
      - ../data:/root/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: host
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    healthcheck:
      test: ["CMD", "rosnode", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Predictive controller (optional)
  predictive:
    build:
      context: ..
      dockerfile: docker/Dockerfile.predictive
    platform: linux/amd64
    container_name: predictive_controller
    hostname: predictive
    environment:
      - ROS_HOSTNAME=localhost
      - ROS_MASTER_URI=http://localhost:11311
    network_mode: host
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    depends_on:
      kamikaze:
        condition: service_healthy
    profiles:
      - full
      - predictive
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Trajectory planner (optional)
  trajectory:
    build:
      context: ..
      dockerfile: docker/Dockerfile.trajectory
    platform: linux/amd64
    container_name: trajectory_planner
    hostname: trajectory
    environment:
      - ROS_HOSTNAME=localhost
      - ROS_MASTER_URI=http://localhost:11311
    network_mode: host
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    depends_on:
      kamikaze:
        condition: service_healthy
    profiles:
      - full
      - trajectory
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Performance monitor
  performance:
    build:
      context: ..
      dockerfile: docker/Dockerfile.performance
    platform: linux/amd64
    container_name: performance_monitor
    hostname: performance
    environment:
      - ROS_HOSTNAME=localhost
      - ROS_MASTER_URI=http://localhost:11311
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    volumes:
      - ../logs/performance:/var/log/performance
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    network_mode: host
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    depends_on:
      kamikaze:
        condition: service_healthy
    profiles:
      - full
      - performance
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Monitoring stack
  prometheus:
    image: prom/prometheus:v2.45.0
    platform: linux/amd64
    container_name: prometheus
    hostname: prometheus
    network_mode: host
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus_rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=20GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--rule-files=/etc/prometheus/rules.yml'
    restart: unless-stopped
    profiles:
      - monitoring
      - full
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.1.0
    platform: linux/amd64
    container_name: grafana
    hostname: grafana
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_HTTP_PORT=3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/drone.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring
      - full
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.6.0
    platform: linux/amd64
    container_name: node_exporter
    hostname: node-exporter
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)'
    restart: unless-stopped
    profiles:
      - monitoring
      - full

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    platform: linux/amd64
    container_name: cadvisor
    hostname: cadvisor
    network_mode: host
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=30s'
      - '--disable_metrics=disk,network,tcp,udp,percpu,sched,process,hugetlb,referenced_memory'
    restart: unless-stopped
    profiles:
      - monitoring
      - full

networks:
  default:
    name: kamikaze_network
    driver: bridge

volumes:
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data