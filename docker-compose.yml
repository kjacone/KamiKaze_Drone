# ============================================================
# Docker Compose - Simplified Monitoring Stack
# ============================================================

services:

  # ==========================================================
  # Main ROS / Drone Service
  # ==========================================================

  kamikaze:
    build:
      context: .
      dockerfile: Dockerfile

    image: kamikaze-drone:latest
    platform: linux/amd64
    container_name: kamikaze_drone
    hostname: kamikaze

    environment:
      ROS_HOSTNAME: kamikaze
      ROS_IP: kamikaze
      ROS_MASTER_URI: http://kamikaze:11311
      ENABLE_GUI: "false"
      ENABLE_PERFORMANCE_MONITORING: "true"
      ENABLE_SIMULATION: "false"
      PYTHONUNBUFFERED: "1"
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"

    volumes:
      - ./logs:/root/.ros/log
      - ./data:/root/data
      - ./yolov8s.pt:/root/catkin_ws/src/drone_control/data/models/yolov8s.pt:ro
      # Mount for Fluent Bit to read logs
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

    networks:
      - drone_net

    ports:
      - "11311:11311"  # ROS Master
      - "11312:11312"  # ROS parameter server

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'source /opt/ros/noetic/setup.bash && rosnode list 2>/dev/null | grep -q . || exit 1'"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s


  # ==========================================================
  # Performance Monitor (already has container metrics)
  # ==========================================================

  performance:
    build:
      context: .
      dockerfile: docker/Dockerfile.performance

    image: performance-monitor:latest
    platform: linux/amd64
    container_name: performance_monitor
    hostname: performance

    environment:
      ROS_HOSTNAME: performance
      ROS_IP: performance
      ROS_MASTER_URI: http://kamikaze:11311
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./logs/performance:/var/log/performance
      - ./logs:/root/.ros/log
      - ./data:/root/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

    networks:
      - drone_net

    ports:
      - "8000:8000"  # Performance metrics endpoint

    restart: unless-stopped

    depends_on:
      kamikaze:
        condition: service_healthy

    profiles:
      - performance
      - monitoring
      - full

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

# ============================================================
# Tempo - Alternative to Jaeger (Grafana Native)
# ============================================================

  tempo:
    image: grafana/tempo:2.2.0
    platform: linux/amd64
    container_name: tempo
    hostname: tempo
    
    networks:
      - drone_net
    
    ports:
      - "3200:3200"   # Query
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    
    volumes:
      - ./docker/monitoring/tempo-config.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    
    restart: unless-stopped
    
    profiles:
      - tracing
      - full


  # ==========================================================
  # Prometheus - Metrics Storage
  # ==========================================================

  prometheus:
    image: prom/prometheus:v2.45.0
    platform: linux/amd64
    container_name: prometheus
    hostname: prometheus

    networks:
      - drone_net

    ports:
      - "9090:9090"

    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/prometheus_rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=20GB"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      - "--web.listen-address=0.0.0.0:9090"

    restart: unless-stopped

    profiles:
      - monitoring
      - full

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"


  # ==========================================================
  # Loki - Log Storage
  # ==========================================================

  loki:
    image: grafana/loki:2.9.0
    platform: linux/amd64
    container_name: loki
    hostname: loki

    networks:
      - drone_net

    ports:
      - "3100:3100"

    volumes:
      - ./docker/monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

    command:
      - "-config.file=/etc/loki/loki-config.yml"
      - "-target=all"

    restart: unless-stopped

    profiles:
      - monitoring
      - full

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"


  # ==========================================================
  # Fluent Bit - Log Collector
  # ==========================================================

  fluent-bit:
    image: grafana/fluent-bit-plugin-loki:latest
    platform: linux/amd64
    container_name: fluent_bit
    hostname: fluent-bit

    networks:
      - drone_net

    volumes:
      - ./docker/monitoring/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./docker/monitoring/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - fluent-bit-pos:/fluent-bit/etc/pos

    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push

    restart: unless-stopped

    profiles:
      - monitoring
      - full

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # ==========================================================
  # Grafana - Visualization
  # ==========================================================

  grafana:
    image: grafana/grafana:10.1.0
    platform: linux/amd64
    container_name: grafana
    hostname: grafana

    networks:
      - drone_net

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "10s"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/drone.json:ro

    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

    restart: unless-stopped

    profiles:
      - monitoring
      - full

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"


  # ==========================================================
  # Predictive Controller (Optional)
  # ==========================================================

  predictive:
    build:
      context: .
      dockerfile: docker/Dockerfile.predictive

    image: predictive-controller:latest
    platform: linux/amd64
    container_name: predictive_controller
    hostname: predictive

    environment:
      ROS_HOSTNAME: predictive
      ROS_IP: predictive
      ROS_MASTER_URI: http://kamikaze:11311
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./logs:/root/.ros/log
      - ./data:/root/data

    networks:
      - drone_net

    restart: unless-stopped

    depends_on:
      kamikaze:
        condition: service_healthy

    profiles:
      - predictive
      - full

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"


  # ==========================================================
  # Trajectory Planner (Optional)
  # ==========================================================

  trajectory:
    build:
      context: .
      dockerfile: docker/Dockerfile.trajectory

    image: trajectory-planner:latest
    platform: linux/amd64
    container_name: trajectory_planner
    hostname: trajectory

    environment:
      ROS_HOSTNAME: trajectory
      ROS_IP: trajectory
      ROS_MASTER_URI: http://kamikaze:11311
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./logs:/root/.ros/log
      - ./data:/root/data
      - ./drone_control:/root/catkin_ws/src/drone_control

    networks:
      - drone_net

    restart: unless-stopped

    depends_on:
      kamikaze:
        condition: service_healthy

    profiles:
      - trajectory
      - full

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"


# ============================================================
# Persistent Volumes
# ============================================================

volumes:

  prometheus_data:
    name: prometheus_data

  grafana_data:
    name: grafana_data

  loki_data:
    name: loki_data

  fluent-bit-pos:
    name: fluent_data

  tempo_data:
    name: tempo_data

  jaeger_data:
    name: jaeger_data


# ============================================================
# Networks
# ============================================================

networks:

  drone_net:
    driver: bridge
    name: drone_network