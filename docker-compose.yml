services:
  kamikaze:
    build:
      context: .
      network: host
    platform: linux/amd64
    container_name: kamikaze_drone
    hostname: kamikaze
    environment:
      - DISPLAY=:1
      - ROS_HOSTNAME=localhost
      - ROS_MASTER_URI=http://localhost:11311
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./PX4-Autopilot:/root/PX4-Autopilot
      - ./drone_control:/root/catkin_ws/src/drone_control   # Only the source, not the whole workspace
    # ports:   # remove – host networking already exposes all ports
    #   - "8080:8080"
    #   - "8090:8090"
    #   - "14540:14540/udp"
    command: /bin/bash /entrypoint.sh
    stdin_open: true
    tty: true
    network_mode: host